<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f5ef">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<title>Planking Timer</title>
<style>:root{--ink:#17221d;--moss:#2c4a38;--lime:#d5ff5b;--paper:#f6f5ef;--muted:#68736d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}main{min-height:100vh;padding:24px;display:flex;flex-direction:column;align-items:center}header,.card,.settings{width:min(100%,620px)}header{font-size:13px;font-weight:800;letter-spacing:.1em}.card{margin:auto;text-align:center}.status{color:var(--moss);font-size:12px;font-weight:800;letter-spacing:.16em}.time{font-size:clamp(86px,28vw,180px);font-weight:800;letter-spacing:-.08em;font-variant-numeric:tabular-nums}.hint,.note{color:var(--muted)}button{font:inherit;cursor:pointer}.primary,.secondary{min-width:144px;padding:17px 24px;border:2px solid var(--ink);border-radius:999px;font-size:17px;font-weight:800}.primary{background:var(--lime);box-shadow:3px 3px 0 var(--ink)}.secondary{background:transparent;margin-left:10px}.settings{border:2px solid var(--ink);border-radius:18px;background:#fff;padding:22px;margin-top:24px}.settings h2{margin:0 0 16px}.settings strong{display:block;margin-top:17px}.settings label{display:block;margin:10px 0}.settings input[type=number]{width:70px;padding:7px;border:1px solid #aab3ad;border-radius:8px;font:inherit}.step{display:inline-flex;gap:7px;align-items:center}.step button{width:32px;height:32px;border:1px solid #aab3ad;border-radius:50%;background:#fff;font-size:20px}.hidden{display:none}@media(max-width:420px){.secondary{margin:12px 0 0}.buttons{display:flex;flex-direction:column;align-items:center}}</style>
</head>
<body>
<main>
<header>● PLANKING TIMER</header>
<section class="card">
<p class="status" id="status">READY</p>
<div class="time" id="time">00:00</div>
<p class="hint" id="hint">Press start when you’re ready.</p>
<div class="buttons">
<button class="primary" id="start">Start</button>
<button class="secondary" id="reset" hidden>Reset</button>
</div>
</section>
<p class="note" id="note">Every 15 seconds: spoken update</p>
<section class="settings">
<h2>Settings</h2>
<strong>Timer mode</strong>
<label>
<input type="radio" name="direction" value="up" checked> Count up freely</label>
<label>
<input type="radio" name="direction" value="down"> Count down to a goal</label>
<label id="goal-row" class="hidden">Goal: <span class="step">
<button id="minus" type="button">−</button>
<input id="goal" type="number" min="1" value="3">
<button id="plus" type="button">+</button>
</span> minutes</label>
<label>
<input id="ready" type="checkbox" checked> Ready count-in (3, 2, 1)</label>
<strong>Interval cue</strong>
<label>
<input type="radio" name="cue" value="voice" checked> Say the timer time</label>
<label>
<input type="radio" name="cue" value="off"> Turn cues off</label>
<label>Every <input id="interval" type="number" min="5" step="5" value="15"> seconds</label>
</section>
</main>
<script>
const $=x=>document.getElementById(x),state={phase:'idle',elapsed:0,goal:180,direction:'up',interval:15,cue:'voice',next:15,started:0,frame:0,ready:0,voice:null,wake:null};
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');const words=s=>{let m=Math.floor(s/60),r=s%60;return !m?`${s} seconds`:!r?`${m} ${m===1?'minute':'minutes'}`:`${m} ${m===1?'minute':'minutes'} ${r} seconds`};const selected=()=>document.querySelector('input[name=direction]:checked').value;const cueMode=()=>document.querySelector('input[name=cue]:checked').value;
async function keepScreenAwake(){if(!navigator.wakeLock||state.wake||state.phase!=='running')return;try{state.wake=await navigator.wakeLock.request('screen');state.wake.addEventListener('release',()=>{state.wake=null})}catch(e){}}async function releaseScreenWake(){if(!state.wake)return;let lock=state.wake;state.wake=null;try{await lock.release()}catch(e){}}function stop(){cancelAnimationFrame(state.frame);clearTimeout(state.ready);state.frame=state.ready=0;releaseScreenWake();if('speechSynthesis'in window)speechSynthesis.cancel()}function remaining(){return Math.max(0,state.goal-state.elapsed)}function render(){let down=state.phase==='running'||state.phase==='paused'||state.phase==='done'?state.direction:selected();$('time').textContent=state.phase==='ready'?String(state.count):state.phase==='idle'?'00:00':fmt(down==='down'?remaining():state.elapsed);$('status').textContent=state.phase==='ready'?'GET READY':state.phase==='running'?'PLANKING':state.phase==='paused'?'PAUSED':state.phase==='done'?'COMPLETE':'READY';$('hint').textContent=state.phase==='done'?'Nice work.':state.phase==='running'?'You’ve got this.':state.phase==='ready'?'Find your position':'Press start when you’re ready.';$('start').textContent=state.phase==='ready'?'Cancel':state.phase==='running'?'Pause':state.phase==='paused'?'Resume':state.phase==='done'?'Start again':'Start';$('reset').hidden=['idle','ready'].includes(state.phase);$('goal-row').classList.toggle('hidden',down!=='down');$('note').textContent=cueMode()==='off'?'Interval cues are off':`Every ${$('interval').value||30} seconds: spoken update`}
function primeSpeech(){if(!('speechSynthesis'in window)||state.cue==='off')return;state.voice=new SpeechSynthesisUtterance(' ');state.voice.volume=0;speechSynthesis.speak(state.voice)}function speak(text){if(!('speechSynthesis'in window)||state.cue==='off'||state.phase!=='running')return;speechSynthesis.cancel();speechSynthesis.resume();state.voice=new SpeechSynthesisUtterance(text);state.voice.rate=.9;speechSynthesis.speak(state.voice)}function tick(now){if(state.phase!=='running')return;state.elapsed=Math.floor((now-state.started)/1000);if(state.direction==='down'&&remaining()===0){state.phase='done';releaseScreenWake();if(state.cue==='voice'){state.voice=new SpeechSynthesisUtterance('Complete');speechSynthesis.speak(state.voice)}render();return}if(state.elapsed>=state.next){speak(words(state.direction==='down'?state.goal-state.next:state.next));state.next+=state.interval}render();state.frame=requestAnimationFrame(tick)}function run(){state.phase='running';state.started=performance.now()-state.elapsed*1000;state.next=(Math.floor(state.elapsed/state.interval)+1)*state.interval;keepScreenAwake();state.frame=requestAnimationFrame(tick);render()}
$('start').onclick=()=>{if(state.phase==='ready'){stop();state.phase='idle';render();return}if(state.phase==='running'){cancelAnimationFrame(state.frame);state.frame=0;releaseScreenWake();state.phase='paused';render();return}if(state.phase==='paused'){run();return}stop();state.elapsed=0;state.direction=selected();state.goal=Math.max(1,Number($('goal').value)||3)*60;state.interval=Math.max(5,Number($('interval').value)||30);state.cue=cueMode();primeSpeech();if($('ready').checked){state.phase='ready';state.count=3;render();let count=()=>{if(state.phase!=='ready')return;state.count--;if(!state.count)run();else{render();state.ready=setTimeout(count,1000)}};state.ready=setTimeout(count,1000)}else run()};$('reset').onclick=()=>{stop();state.elapsed=0;state.phase='idle';render()};$('minus').onclick=()=>{$('goal').value=Math.max(1,(Number($('goal').value)||1)-1);render()};$('plus').onclick=()=>{$('goal').value=(Number($('goal').value)||0)+1;render()};document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.phase==='running')keepScreenAwake()});document.querySelectorAll('input').forEach(x=>x.onchange=render);render();
</script>
</body>
</html>
