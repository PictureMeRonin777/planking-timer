<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f5ef"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-512.png"><title>Planking Timer</title><style>
:root{--ink:#17221d;--moss:#2c4a38;--lime:#d5ff5b;--paper:#f6f5ef;--muted:#68736d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}main{min-height:100vh;padding:24px;display:flex;flex-direction:column;align-items:center}header{width:min(100%,620px);font-size:13px;font-weight:800;letter-spacing:.1em}.card{width:min(100%,620px);margin:auto;text-align:center}.status{color:var(--moss);font-size:12px;font-weight:800;letter-spacing:.16em}.time{font-size:clamp(86px,28vw,180px);font-weight:800;letter-spacing:-.08em;font-variant-numeric:tabular-nums}.hint,.note{color:var(--muted)}button{font:inherit;cursor:pointer}.primary,.secondary{min-width:144px;padding:17px 24px;border:2px solid var(--ink);border-radius:999px;font-size:17px;font-weight:800}.primary{background:var(--lime);box-shadow:3px 3px 0 var(--ink)}.secondary{background:transparent;margin-left:10px}.settings{width:min(100%,620px);border:2px solid var(--ink);border-radius:18px;background:#fff;padding:22px;margin-top:24px}.settings h2{margin:0 0 16px;font-size:20px}.settings strong{display:block;margin-top:17px}.settings label{display:block;margin:10px 0}.settings input[type=number]{width:72px;padding:7px;border:1px solid #aab3ad;border-radius:8px;font:inherit}.stepper{display:inline-flex;align-items:center;gap:7px}.stepper button{width:32px;height:32px;border:1px solid #aab3ad;border-radius:50%;background:#fff;font-size:20px;line-height:1}.hidden{display:none}@media(max-width:420px){.secondary{margin:12px 0 0}.buttons{display:flex;flex-direction:column;align-items:center}}
</style></head><body><main><header>● PLANKING TIMER</header><section class="card"><p class="status" id="status">READY</p><div class="time" id="time">00:00</div><p class="hint" id="hint">Press start when you’re ready.</p><div class="buttons"><button class="primary" id="start">Start</button><button class="secondary" id="reset" hidden>Reset</button></div></section><p class="note" id="note">Every 30 seconds: spoken update</p><section class="settings"><h2>Settings</h2><strong>Timer mode</strong><label><input type="radio" name="direction" value="up" checked> Count up freely</label><label><input type="radio" name="direction" value="down"> Count down to a goal</label><label id="duration-row" class="hidden">Goal: <span class="stepper"><button type="button" id="minus" aria-label="Subtract one minute">−</button><input type="number" id="duration" min="1" value="3"><button type="button" id="plus" aria-label="Add one minute">+</button></span> minutes</label><label><input type="checkbox" id="countdown" checked> Ready countdown (3, 2, 1)</label><strong>Interval cue</strong><label><input type="radio" name="cue" value="voice" checked> Say elapsed time</label><label><input type="radio" name="cue" value="beep"> Beep</label><label><input type="radio" name="cue" value="off"> Turn cues off</label><label>Every <input type="number" id="interval" min="5" step="5" value="30"> seconds</label></section></main><script>
const $=id=>document.getElementById(id),time=$('time'),status=$('status'),hint=$('hint'),start=$('start'),reset=$('reset'),note=$('note'),duration=$('duration'),interval=$('interval');let elapsed=0,phase='idle',timer,ready=3,ctx;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');const words=s=>{let m=Math.floor(s/60),r=s%60;return !m?`${s} seconds`:!r?`${m} ${m===1?'minute':'minutes'}`:`${m} ${m===1?'minute':'minutes'} ${r} seconds`};const mode=()=>document.querySelector('input[name=cue]:checked').value;const direction=()=>document.querySelector('input[name=direction]:checked').value;const goal=()=>Math.max(1,Number(duration.value)||1)*60;const every=()=>Math.max(5,Number(interval.value)||30);
function remaining(){return Math.max(0,goal()-elapsed)}function render(){let down=direction()==='down';time.textContent=phase==='ready'?ready:fmt(down?remaining():elapsed);status.textContent=phase==='ready'?'GET READY':phase==='running'?'PLANKING':phase==='paused'?'PAUSED':phase==='done'?'COMPLETE':'READY';hint.textContent=phase==='ready'?'Find your position':phase==='done'?'Nice work.':phase==='running'?'You’ve got this.':'Press start when you’re ready.';start.textContent=phase==='paused'?'Resume':phase==='done'?'Start again':'Start';reset.hidden=['idle','ready'].includes(phase);$('duration-row').classList.toggle('hidden',!down);note.textContent=mode()==='off'?'Interval cues are off':`Every ${every()} seconds: ${mode()==='voice'?'spoken update':'beep'}`}
function speak(text){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(text))}function cue(){if(mode()==='off')return;if(mode()==='voice'){speak(words(direction()==='down'?remaining():elapsed));return}ctx??=new AudioContext;let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.12,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.16);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.16)}
function finish(){clearInterval(timer);phase='done';if(mode()==='voice')speak('Complete');else{ctx??=new AudioContext;for(let i=0;i<2;i++)setTimeout(cue,i*220)}render()}function run(){phase='running';let began=Date.now(),prior=elapsed,last=Math.floor(elapsed/every())*every();timer=setInterval(()=>{elapsed=prior+Math.floor((Date.now()-began)/1000);if(direction()==='down'&&remaining()===0){finish();return}if(elapsed&&elapsed%every()===0&&elapsed!==last){last=elapsed;cue()}render()},250);render()}
start.onclick=()=>{ctx??=new AudioContext;ctx.resume();if(phase==='running'){clearInterval(timer);phase='paused';render();return}if(phase==='paused'){run();return}elapsed=0;if($('countdown').checked){phase='ready';ready=3;render();let c=setInterval(()=>{ready--;if(!ready){clearInterval(c);run()}else render()},1000)}else run()};reset.onclick=()=>{clearInterval(timer);elapsed=0;phase='idle';render()};$('minus').onclick=()=>{duration.value=Math.max(1,(Number(duration.value)||1)-1);render()};$('plus').onclick=()=>{duration.value=(Number(duration.value)||0)+1;render()};document.querySelectorAll('input').forEach(x=>x.onchange=render);render();
</script></body></html>
