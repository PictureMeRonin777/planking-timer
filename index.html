<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planking Timer</title><style>
:root{--ink:#17221d;--moss:#2c4a38;--lime:#d5ff5b;--paper:#f6f5ef;--muted:#68736d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}main{min-height:100vh;padding:24px;display:flex;flex-direction:column;align-items:center}header{width:min(100%,620px);font-size:13px;font-weight:800;letter-spacing:.1em}button{font:inherit;cursor:pointer}.card{width:min(100%,620px);margin:auto;text-align:center}.status{color:var(--moss);font-size:12px;font-weight:800;letter-spacing:.16em}.time{font-size:clamp(86px,28vw,180px);font-weight:800;letter-spacing:-.08em;font-variant-numeric:tabular-nums}.hint,.note{color:var(--muted)}.primary,.secondary{min-width:144px;padding:17px 24px;border:2px solid var(--ink);border-radius:999px;font-size:17px;font-weight:800}.primary{background:var(--lime);box-shadow:3px 3px 0 var(--ink)}.secondary{background:transparent;margin-left:10px}.settings{width:min(100%,620px);border:2px solid var(--ink);border-radius:18px;background:#fff;padding:22px;margin-top:24px}.settings label{display:block;margin:12px 0}.settings h2{margin-top:0;font-size:20px}@media(max-width:420px){.secondary{margin:12px 0 0}.buttons{display:flex;flex-direction:column;align-items:center}}
</style></head><body><main><header>● PLANKING TIMER</header><section class="card"><p class="status" id="status">READY</p><div class="time" id="time">00:00</div><p class="hint" id="hint">Press start when you’re ready.</p><div class="buttons"><button class="primary" id="start">Start</button><button class="secondary" id="reset" hidden>Reset</button></div></section><p class="note" id="note">Every 30 seconds: beep</p><section class="settings"><h2>Settings</h2><label><input type="checkbox" id="countdown" checked> Ready countdown (3, 2, 1)</label><label><input type="radio" name="cue" value="beep" checked> Beep every 30 seconds</label><label><input type="radio" name="cue" value="voice"> Say elapsed time every 30 seconds</label><label><input type="radio" name="cue" value="off"> Turn cues off</label></section></main><script>
const $=id=>document.getElementById(id), time=$('time'),status=$('status'),hint=$('hint'),start=$('start'),reset=$('reset'),note=$('note');let elapsed=0,phase='idle',timer,ready=3,ctx;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');const words=s=>{let m=Math.floor(s/60),r=s%60;return !m?`${s} seconds`:!r?`${m} ${m===1?'minute':'minutes'}`:`${m} ${m===1?'minute':'minutes'} ${r} seconds`};
const mode=()=>document.querySelector('input[name=cue]:checked').value;function render(){time.textContent=phase==='ready'?ready:fmt(elapsed);status.textContent=phase==='ready'?'GET READY':phase==='running'?'PLANKING':phase==='paused'?'PAUSED':'READY';hint.textContent=phase==='ready'?'Find your position':phase==='running'?'You’ve got this.':'Press start when you’re ready.';start.textContent=phase==='paused'?'Resume':'Start';reset.hidden=phase==='idle'||phase==='ready';note.textContent=mode()==='off'?'30-second cues are off':`Every 30 seconds: ${mode()==='voice'?'spoken update':'beep'}`}
function cue(){if(mode()==='off')return;if(mode()==='voice'){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(words(elapsed)));return}ctx??=new AudioContext;let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.12,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.16);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.16)}
function run(){phase='running';let began=Date.now(),prior=elapsed,last=Math.floor(elapsed/30)*30;timer=setInterval(()=>{elapsed=prior+Math.floor((Date.now()-began)/1000);if(elapsed&&elapsed%30===0&&elapsed!==last){last=elapsed;cue()}render()},250);render()}start.onclick=()=>{ctx??=new AudioContext;ctx.resume();if(phase==='running'){clearInterval(timer);phase='paused';render();return}if(phase==='paused'){run();return}if($('countdown').checked){phase='ready';ready=3;render();let c=setInterval(()=>{ready--;if(!ready){clearInterval(c);run()}else render()},1000)}else run()};reset.onclick=()=>{clearInterval(timer);elapsed=0;phase='idle';render()};document.querySelectorAll('input').forEach(x=>x.onchange=render);render();
</script></body></html>
